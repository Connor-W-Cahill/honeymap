<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HoneyMap</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    :root {
      --bg:        #070B14;
      --surface:   #0C1220;
      --surface2:  #111827;
      --border:    #1a2440;
      --border2:   #243050;
      --text:      #C8D8F0;
      --text-dim:  #4A6080;
      --text-mid:  #7A96B8;
      --green:     #00FF9C;
      --green-dim: #00CC7A;
      --red:       #FF3B30;
      --amber:     #FFB340;
      --blue:      #4D9FFF;
      --mono:      'JetBrains Mono', monospace;
      --sans:      'Inter', system-ui, sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--sans);
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Header ── */
    header {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 0 20px;
      height: 42px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 9px;
    }
    .logo-mark {
      width: 22px;
      height: 22px;
      position: relative;
      flex-shrink: 0;
    }
    .logo-mark svg { display: block; }
    header h1 {
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: var(--text);
    }

    #ws-status {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.72rem;
      color: var(--text-mid);
    }
    #ws-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--red);
      transition: background 0.4s;
    }
    #ws-dot.connected {
      background: var(--green);
      box-shadow: 0 0 6px var(--green);
      animation: pulse 2.4s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 4px var(--green); }
      50%       { box-shadow: 0 0 10px var(--green); }
    }
    @media (prefers-reduced-motion: reduce) {
      #ws-dot.connected { animation: none; }
    }

    /* ── Stats strip ── */
    #stats-strip {
      display: flex;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .stat-cell {
      flex: 1;
      padding: 10px 20px;
      border-right: 1px solid var(--border);
    }
    .stat-cell:last-child { border-right: none; }
    .stat-label {
      font-size: 0.65rem;
      font-weight: 500;
      color: var(--text-dim);
      margin-bottom: 2px;
    }
    .stat-value {
      font-family: var(--mono);
      font-size: 1.05rem;
      font-weight: 500;
      color: var(--green);
      line-height: 1;
    }

    /* ── Main grid ── */
    main {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0;
      overflow: hidden;
    }

    .panel {
      background: var(--bg);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border-right: 1px solid var(--border);
    }
    .panel:last-child { border-right: none; }

    .panel-title {
      padding: 9px 16px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--text-mid);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 7px;
    }
    .panel-title .dot {
      width: 5px; height: 5px;
      border-radius: 50%;
      background: var(--green);
      flex-shrink: 0;
    }

    /* ── Forms ── */
    .tool-row {
      display: flex;
      gap: 8px;
      padding: 10px 14px;
      flex-shrink: 0;
      border-bottom: 1px solid var(--border);
      background: var(--surface2);
    }
    .tool-input {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border2);
      color: var(--text);
      padding: 6px 10px;
      font-family: var(--mono);
      font-size: 0.8rem;
      outline: none;
      transition: border-color 0.2s;
    }
    .tool-input:focus { border-color: var(--blue); }
    .tool-input::placeholder { color: var(--text-dim); }

    .btn-primary {
      background: var(--green);
      border: none;
      color: var(--bg);
      font-family: var(--sans);
      font-weight: 600;
      font-size: 0.78rem;
      padding: 6px 14px;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s;
    }
    .btn-primary:hover { background: var(--green-dim); }
    .btn-primary:disabled { opacity: 0.35; cursor: not-allowed; }

    .btn-secondary {
      background: var(--surface2);
      border: 1px solid var(--border2);
      color: var(--text-mid);
      font-family: var(--sans);
      font-weight: 500;
      font-size: 0.78rem;
      padding: 6px 12px;
      cursor: pointer;
      white-space: nowrap;
      transition: border-color 0.15s, color 0.15s;
    }
    .btn-secondary:hover { border-color: var(--blue); color: var(--blue); }
    .btn-secondary:disabled { opacity: 0.35; cursor: not-allowed; }

    .status-line {
      padding: 4px 14px;
      font-size: 0.71rem;
      color: var(--text-dim);
      flex-shrink: 0;
      min-height: 22px;
      font-family: var(--mono);
    }

    /* ── Tables ── */
    .table-wrap {
      flex: 1;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--border2) transparent;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.74rem;
    }
    thead th {
      position: sticky;
      top: 0;
      background: var(--surface);
      padding: 6px 12px;
      text-align: left;
      color: var(--text-dim);
      font-weight: 500;
      font-size: 0.67rem;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
      z-index: 1;
    }
    tbody tr {
      border-bottom: 1px solid var(--border);
      transition: background 0.1s;
    }
    tbody tr:hover { background: var(--surface2); }
    tbody td {
      padding: 5px 12px;
      font-family: var(--mono);
      font-size: 0.73rem;
      vertical-align: middle;
    }
    tbody td.text { font-family: var(--sans); }

    .port-high  { color: var(--red); font-weight: 500; }
    .port-med   { color: var(--amber); }
    .port-low   { color: var(--green); }

    .abuse-high { color: var(--red); font-weight: 500; }
    .abuse-med  { color: var(--amber); }
    .abuse-low  { color: var(--green); }
    .abuse-none { color: var(--text-dim); }

    .trunc {
      max-width: 100px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #scan-empty {
      padding: 32px 20px;
      color: var(--text-dim);
      font-size: 0.78rem;
      text-align: center;
      font-family: var(--sans);
    }

    /* ── Scan section divider ── */
    .section-divider {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 7px 14px;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      font-size: 0.67rem;
      font-weight: 600;
      color: var(--text-dim);
      flex-shrink: 0;
    }

    /* ── Discover results ── */
    #discover-results { display: none; flex-shrink: 0; }
    .discover-scan-btn {
      background: none;
      border: 1px solid var(--border2);
      color: var(--blue);
      font-family: var(--mono);
      font-size: 0.67rem;
      padding: 2px 7px;
      cursor: pointer;
      transition: border-color 0.15s;
    }
    .discover-scan-btn:hover { border-color: var(--blue); }

    /* ── Map ── */
    #map {
      height: 280px;
      min-height: 280px;
      flex-shrink: 0;
    }
    .leaflet-popup-content-wrapper {
      background: var(--surface) !important;
      color: var(--text) !important;
      border: 1px solid var(--border2) !important;
      border-radius: 0 !important;
      box-shadow: 0 4px 16px rgba(0,0,0,0.5) !important;
      font-family: var(--mono) !important;
      font-size: 0.73rem !important;
    }
    .leaflet-popup-tip { background: var(--surface) !important; }
    .leaflet-popup-close-button { color: var(--text-dim) !important; }

    /* ── Hit counter ── */
    #honey-counter {
      padding: 4px 14px;
      font-size: 0.67rem;
      color: var(--text-dim);
      font-family: var(--mono);
      text-align: right;
      flex-shrink: 0;
      border-bottom: 1px solid var(--border);
    }

    /* ── Animations ── */
    @keyframes slideIn {
      from { opacity: 0; background: rgba(0, 255, 156, 0.06); }
      to   { opacity: 1; background: transparent; }
    }
    .row-new {
      animation: slideIn 0.5s ease forwards;
    }
    @media (prefers-reduced-motion: reduce) {
      .row-new { animation: none; }
    }

    .threat-row td {
      border-left: 2px solid var(--red);
      color: var(--red);
      font-weight: 500;
    }

    @keyframes flashBorder {
      0%, 100% { border-left-color: var(--red); }
      50%       { border-left-color: transparent; }
    }
    .threat-flash td:first-child {
      border-left: 2px solid var(--red);
      animation: flashBorder 0.4s ease 4;
    }
  </style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-mark">
      <svg width="22" height="22" viewBox="0 0 22 22" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="11" cy="11" r="10" stroke="#1a2440" stroke-width="1.5"/>
        <circle cx="11" cy="11" r="6" stroke="#243050" stroke-width="1"/>
        <circle cx="11" cy="11" r="2.5" fill="#00FF9C"/>
        <line x1="11" y1="1" x2="11" y2="5" stroke="#00FF9C" stroke-width="1.5" stroke-linecap="round"/>
        <line x1="11" y1="17" x2="11" y2="21" stroke="#1a2440" stroke-width="1.5" stroke-linecap="round"/>
        <line x1="1" y1="11" x2="5" y2="11" stroke="#1a2440" stroke-width="1.5" stroke-linecap="round"/>
        <line x1="17" y1="11" x2="21" y2="11" stroke="#1a2440" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
    </div>
    <h1>HoneyMap</h1>
  </div>

  <div id="ws-status">
    <div id="ws-dot"></div>
    <span id="ws-label">Connecting</span>
  </div>
</header>

<div id="stats-strip">
  <div class="stat-cell">
    <div class="stat-label">Total hits</div>
    <div class="stat-value" id="stat-total">—</div>
  </div>
  <div class="stat-cell">
    <div class="stat-label">Unique IPs</div>
    <div class="stat-value" id="stat-unique">—</div>
  </div>
  <div class="stat-cell">
    <div class="stat-label">Top port</div>
    <div class="stat-value" id="stat-port">—</div>
  </div>
  <div class="stat-cell">
    <div class="stat-label">Top country</div>
    <div class="stat-value" id="stat-country">—</div>
  </div>
  <div class="stat-cell">
    <div class="stat-label">Last hour</div>
    <div class="stat-value" id="stat-hour">—</div>
  </div>
</div>

<main>
  <!-- LEFT — Scanner -->
  <div class="panel">
    <div class="panel-title"><span class="dot"></span>Port scanner</div>

    <form class="tool-row" id="scan-form" onsubmit="triggerScan(event)">
      <input class="tool-input" id="scan-host" type="text" placeholder="IP or hostname" value="127.0.0.1" autocomplete="off" spellcheck="false" />
      <button class="btn-primary" id="scan-btn" type="submit">Scan</button>
    </form>
    <div class="status-line" id="scan-status"></div>

    <div class="table-wrap">
      <div id="scan-empty">Enter a target and scan.</div>
      <table id="scan-table" style="display:none">
        <thead>
          <tr><th>Port</th><th>Service</th><th>Version</th></tr>
        </thead>
        <tbody id="scan-tbody"></tbody>
      </table>
    </div>

    <div class="section-divider">Network discovery</div>
    <form class="tool-row" id="discover-form" onsubmit="triggerDiscover(event)">
      <input class="tool-input" id="discover-subnet" type="text" placeholder="192.168.1.0/24" autocomplete="off" spellcheck="false" />
      <button class="btn-secondary" id="discover-btn" type="submit">Sweep</button>
    </form>
    <div class="status-line" id="discover-status"></div>
    <div id="discover-results">
      <div class="table-wrap" style="max-height:130px">
        <table>
          <thead><tr><th>Live host</th><th></th></tr></thead>
          <tbody id="discover-tbody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- RIGHT — Honeypot feed -->
  <div class="panel">
    <div class="panel-title"><span class="dot"></span>Honeypot feed</div>
    <div id="map"></div>
    <div id="honey-counter">0 hits captured</div>
    <div class="table-wrap" id="honey-table-wrap">
      <table>
        <thead>
          <tr>
            <th>Time</th>
            <th>IP</th>
            <th>Port</th>
            <th>Country</th>
            <th>ISP</th>
            <th>rDNS</th>
            <th>Banner</th>
            <th>Risk</th>
          </tr>
        </thead>
        <tbody id="honey-tbody"></tbody>
      </table>
    </div>
  </div>
</main>

<script>
const WS_URL   = 'ws://localhost:8000/ws';
const API_BASE = 'http://localhost:8000';
const MAX_ROWS = 50;

// ── Map ──────────────────────────────────────
const map = L.map('map', { zoomControl: false }).setView([20, 0], 2);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
  maxZoom: 19,
}).addTo(map);
L.control.zoom({ position: 'bottomright' }).addTo(map);

// ── State ────────────────────────────────────
let ws = null;
let honeyCount = 0;
const ipRowMap = {};

// ── WebSocket ────────────────────────────────
function connectWS() {
  ws = new WebSocket(WS_URL);
  ws.onopen = () => {
    document.getElementById('ws-dot').classList.add('connected');
    document.getElementById('ws-label').textContent = 'Live';
    loadHistory();
  };
  ws.onmessage = (evt) => {
    try { handleMessage(JSON.parse(evt.data)); }
    catch (e) { console.warn('WS parse error', e); }
  };
  ws.onclose = () => {
    document.getElementById('ws-dot').classList.remove('connected');
    document.getElementById('ws-label').textContent = 'Reconnecting';
    setTimeout(connectWS, 3000);
  };
  ws.onerror = () => ws.close();
}

async function loadHistory() {
  try {
    const res = await fetch(`${API_BASE}/hits`);
    if (!res.ok) return;
    const hits = await res.json();
    [...hits].reverse().forEach(h => handleHoneypotHit({ ...h, type: 'honeypot_hit' }));
  } catch (_) {}
}

// ── Router ───────────────────────────────────
function handleMessage(msg) {
  switch (msg.type) {
    case 'honeypot_hit':      handleHoneypotHit(msg);     break;
    case 'scan_result':       handleScanResult(msg);      break;
    case 'threat_escalation': handleThreatEscalation(msg);break;
    case 'stats':             handleStats(msg);           break;
    case 'discover_host':     handleDiscoverHost(msg);    break;
    case 'discover_done':     handleDiscoverDone(msg);    break;
  }
}

// ── Honeypot hit ─────────────────────────────
function handleHoneypotHit(msg) {
  if (msg.lat != null && msg.lng != null) {
    const color = riskColor(msg.abuse_score);
    const marker = L.circleMarker([msg.lat, msg.lng], {
      radius: 5,
      fillColor: color,
      color: color,
      weight: 1.5,
      opacity: 1,
      fillOpacity: 0.7,
    }).addTo(map);
    marker.bindPopup(
      `<b style="color:${color}">${esc(msg.ip)}</b><br>` +
      `Port ${msg.port} · ${esc(msg.country || '—')}<br>` +
      `${esc(msg.isp || '—')}<br>` +
      (msg.rdns ? `${esc(msg.rdns)}<br>` : '') +
      `Risk: ${msg.abuse_score != null ? msg.abuse_score : 'unknown'}`
    );
  }

  const tbody = document.getElementById('honey-tbody');
  const tr = document.createElement('tr');
  tr.className = 'row-new';
  tr.dataset.ip = msg.ip;
  tr.innerHTML = `
    <td>${fmtTs(msg.ts)}</td>
    <td>${esc(msg.ip)}${msg.hit_count > 1 ? ` <span style="color:var(--amber);font-size:0.65rem">×${msg.hit_count}</span>` : ''}</td>
    <td>${msg.port}</td>
    <td class="text">${esc(msg.country || '—')}</td>
    <td class="trunc text">${esc(msg.isp || '—')}</td>
    <td class="trunc">${esc(msg.rdns || '—')}</td>
    <td class="trunc" style="color:var(--text-mid)">${msg.banner ? esc(msg.banner) : '<span style="color:var(--text-dim)">—</span>'}</td>
    <td class="${abuseClass(msg.abuse_score)}">${msg.abuse_score != null ? msg.abuse_score : '—'}</td>
  `;
  tbody.insertBefore(tr, tbody.firstChild);
  ipRowMap[msg.ip] = tr;
  while (tbody.rows.length > MAX_ROWS) tbody.deleteRow(tbody.rows.length - 1);

  honeyCount++;
  document.getElementById('honey-counter').textContent = `${honeyCount} hit${honeyCount !== 1 ? 's' : ''} captured`;
}

// ── Threat escalation ─────────────────────────
function handleThreatEscalation(msg) {
  const existing = ipRowMap[msg.ip];
  if (existing) {
    existing.classList.remove('threat-flash');
    void existing.offsetWidth;
    existing.classList.add('threat-flash');
  }
  const tbody = document.getElementById('honey-tbody');
  const tr = document.createElement('tr');
  tr.className = 'threat-row';
  tr.innerHTML = `<td colspan="8" class="text">Persistent attacker — ${esc(msg.ip)} · ${msg.hit_count} hits</td>`;
  tbody.insertBefore(tr, tbody.firstChild);
}

// ── Stats ─────────────────────────────────────
function handleStats(msg) {
  document.getElementById('stat-total').textContent   = msg.total_hits     ?? '—';
  document.getElementById('stat-unique').textContent  = msg.unique_ips     ?? '—';
  document.getElementById('stat-port').textContent    = msg.top_port       ?? '—';
  document.getElementById('stat-country').textContent = msg.top_country    ?? '—';
  document.getElementById('stat-hour').textContent    = msg.hits_last_hour ?? '—';
}

// ── Scan result ───────────────────────────────
function handleScanResult(msg) {
  const empty = document.getElementById('scan-empty');
  const table = document.getElementById('scan-table');
  const tbody = document.getElementById('scan-tbody');
  tbody.innerHTML = '';

  if (!msg.ports || msg.ports.length === 0) {
    empty.style.display = 'block';
    empty.textContent = `No open ports on ${msg.host}.`;
    table.style.display = 'none';
    return;
  }

  empty.style.display = 'none';
  table.style.display = 'table';
  for (const p of msg.ports) {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td class="${portClass(p.port)}">${p.port}</td>
      <td class="text">${esc(p.service || '—')}</td>
      <td style="color:var(--text-mid)">${esc(p.version || '—')}</td>
    `;
    tbody.appendChild(tr);
  }
  document.getElementById('scan-status').textContent =
    `${msg.ports.length} open port${msg.ports.length !== 1 ? 's' : ''} on ${msg.host}`;
}

// ── Scan form ─────────────────────────────────
async function triggerScan(evt) {
  evt.preventDefault();
  const host = document.getElementById('scan-host').value.trim();
  if (!host) return;
  const btn    = document.getElementById('scan-btn');
  const status = document.getElementById('scan-status');
  btn.disabled = true;
  status.textContent = `Scanning ${host}…`;
  try {
    const res = await fetch(`${API_BASE}/scan`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ host }),
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
  } catch (e) {
    status.textContent = `Scan failed: ${e.message}`;
  } finally {
    btn.disabled = false;
  }
}

// ── Discovery ─────────────────────────────────
function handleDiscoverHost(msg) {
  document.getElementById('discover-results').style.display = 'block';
  const tr = document.createElement('tr');
  tr.innerHTML = `
    <td>${esc(msg.ip)}</td>
    <td><button class="discover-scan-btn" onclick="scanFromDiscover('${esc(msg.ip)}')">scan</button></td>
  `;
  document.getElementById('discover-tbody').appendChild(tr);
}

function handleDiscoverDone(msg) {
  document.getElementById('discover-status').textContent =
    `${msg.total} host${msg.total !== 1 ? 's' : ''} found on ${msg.subnet}`;
  document.getElementById('discover-btn').disabled = false;
}

function scanFromDiscover(ip) {
  document.getElementById('scan-host').value = ip;
  document.getElementById('scan-form').dispatchEvent(new Event('submit', { cancelable: true, bubbles: true }));
}

async function triggerDiscover(evt) {
  evt.preventDefault();
  const subnet = document.getElementById('discover-subnet').value.trim();
  if (!subnet) return;
  const btn    = document.getElementById('discover-btn');
  const status = document.getElementById('discover-status');
  btn.disabled = true;
  document.getElementById('discover-tbody').innerHTML = '';
  document.getElementById('discover-results').style.display = 'none';
  status.textContent = `Sweeping ${subnet}…`;
  try {
    const res = await fetch(`${API_BASE}/discover`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ subnet }),
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
  } catch (e) {
    status.textContent = `Failed: ${e.message}`;
    btn.disabled = false;
  }
}

// ── Helpers ───────────────────────────────────
function portClass(port) {
  if ([21, 22, 23, 445, 3389].includes(port)) return 'port-high';
  if ([80, 443, 8080, 8443].includes(port))   return 'port-med';
  return 'port-low';
}
function riskColor(score) {
  if (score == null)   return 'var(--amber)';
  if (score >= 70)     return 'var(--red)';
  if (score >= 30)     return 'var(--amber)';
  return 'var(--green)';
}
function abuseClass(score) {
  if (score == null)  return 'abuse-none';
  if (score >= 70)    return 'abuse-high';
  if (score >= 30)    return 'abuse-med';
  return 'abuse-low';
}
function fmtTs(ts) {
  return new Date(ts * 1000).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
}
function esc(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
