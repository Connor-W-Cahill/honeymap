<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HoneyMap</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    /* ── Tokens ── */
    :root {
      --bg:        #05080f;
      --surface:   #090d18;
      --surface2:  #0d1220;
      --surface3:  #111828;
      --border:    #161f32;
      --border2:   #1e2d48;
      --text:      #c9d8f0;
      --text-dim:  #3d5470;
      --text-mid:  #6b87aa;
      --green:     #00e887;
      --green-dim: #00bc6e;
      --green-glow:rgba(0,232,135,0.15);
      --red:       #ff3b3b;
      --red-dim:   rgba(255,59,59,0.12);
      --amber:     #f5a623;
      --blue:      #4c9fff;
      --purple:    #9b7fe8;
      --mono:      'JetBrains Mono', monospace;
      --sans:      'Inter', system-ui, sans-serif;
      --radius:    3px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--sans);
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: grid;
      grid-template-rows: 44px auto 1fr;
      overflow: hidden;
    }

    /* ── Header ── */
    header {
      display: flex;
      align-items: center;
      gap: 0;
      padding: 0 16px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      z-index: 10;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      padding-right: 20px;
      border-right: 1px solid var(--border);
      height: 100%;
    }
    .logo-mark { width: 20px; height: 20px; flex-shrink: 0; }
    .logo-name {
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: var(--text);
      text-transform: uppercase;
    }

    .header-stats {
      display: flex;
      align-items: stretch;
      height: 100%;
      flex: 1;
      margin-left: 0;
    }
    .hstat {
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 0 18px;
      border-right: 1px solid var(--border);
      min-width: 90px;
    }
    .hstat-label {
      font-size: 0.58rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 1px;
    }
    .hstat-value {
      font-family: var(--mono);
      font-size: 0.92rem;
      font-weight: 500;
      color: var(--green);
      line-height: 1;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-left: auto;
      padding-left: 16px;
    }

    #ws-pill {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 4px 10px;
      background: var(--surface2);
      border: 1px solid var(--border2);
      border-radius: 20px;
      font-size: 0.68rem;
      color: var(--text-mid);
    }
    #ws-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--red);
      transition: background 0.4s;
      flex-shrink: 0;
    }
    #ws-dot.connected {
      background: var(--green);
      box-shadow: 0 0 0 2px var(--green-glow);
      animation: pulse 2.4s ease-in-out infinite;
    }
    @keyframes pulse {
      0%,100% { box-shadow: 0 0 0 2px var(--green-glow); }
      50%      { box-shadow: 0 0 0 5px var(--green-glow); }
    }
    @media (prefers-reduced-motion: reduce) { #ws-dot.connected { animation: none; } }

    .btn-ghost {
      background: none;
      border: 1px solid var(--border2);
      color: var(--text-mid);
      font-family: var(--sans);
      font-size: 0.7rem;
      font-weight: 500;
      padding: 5px 12px;
      cursor: pointer;
      border-radius: var(--radius);
      transition: border-color 0.15s, color 0.15s;
    }
    .btn-ghost:hover { border-color: var(--green); color: var(--green); }

    /* ── Rate bar ── */
    #rate-bar {
      display: flex;
      align-items: flex-end;
      gap: 2px;
      padding: 5px 16px;
      height: 32px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .rate-label {
      font-size: 0.57rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--text-dim);
      align-self: center;
      margin-right: 8px;
      white-space: nowrap;
    }
    .rate-col {
      flex: 1;
      background: var(--border2);
      border-radius: 1px;
      min-height: 2px;
      transition: height 0.3s, background 0.3s;
    }
    .rate-col.active { background: var(--green); }

    /* ── Main grid: sidebar + center + right ── */
    main {
      display: grid;
      grid-template-columns: 340px 1fr 320px;
      overflow: hidden;
    }

    /* ── Panel base ── */
    .panel {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border-right: 1px solid var(--border);
    }
    .panel:last-child { border-right: none; }

    .panel-head {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 14px;
      height: 36px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .panel-head-dot {
      width: 5px; height: 5px;
      border-radius: 50%;
      background: var(--green);
      flex-shrink: 0;
    }
    .panel-head-title {
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-mid);
    }
    .panel-head-actions { margin-left: auto; display: flex; gap: 6px; }

    /* ── Divider ── */
    .divider {
      display: flex;
      align-items: center;
      padding: 0 14px;
      height: 28px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      font-size: 0.6rem;
      font-weight: 600;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: var(--text-dim);
      flex-shrink: 0;
    }

    /* ── Tool row ── */
    .tool-row {
      display: flex;
      gap: 6px;
      padding: 8px 12px;
      background: var(--surface2);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .tool-input {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border2);
      color: var(--text);
      padding: 6px 10px;
      font-family: var(--mono);
      font-size: 0.78rem;
      outline: none;
      border-radius: var(--radius);
      transition: border-color 0.15s;
    }
    .tool-input:focus { border-color: var(--blue); }
    .tool-input::placeholder { color: var(--text-dim); }

    .btn-primary {
      background: var(--green);
      border: none;
      color: var(--bg);
      font-family: var(--sans);
      font-weight: 700;
      font-size: 0.75rem;
      padding: 6px 14px;
      cursor: pointer;
      border-radius: var(--radius);
      white-space: nowrap;
      transition: background 0.15s, opacity 0.15s;
    }
    .btn-primary:hover { background: var(--green-dim); }
    .btn-primary:disabled { opacity: 0.3; cursor: not-allowed; }

    .btn-secondary {
      background: var(--surface3);
      border: 1px solid var(--border2);
      color: var(--text-mid);
      font-family: var(--sans);
      font-weight: 500;
      font-size: 0.75rem;
      padding: 6px 12px;
      cursor: pointer;
      border-radius: var(--radius);
      white-space: nowrap;
      transition: border-color 0.15s, color 0.15s;
    }
    .btn-secondary:hover { border-color: var(--blue); color: var(--blue); }
    .btn-secondary:disabled { opacity: 0.3; cursor: not-allowed; }

    .btn-mini {
      background: none;
      border: 1px solid var(--border2);
      color: var(--text-dim);
      font-family: var(--mono);
      font-size: 0.63rem;
      padding: 2px 7px;
      cursor: pointer;
      border-radius: var(--radius);
      white-space: nowrap;
      transition: border-color 0.15s, color 0.15s;
    }
    .btn-mini:hover { border-color: var(--green); color: var(--green); }

    .btn-block {
      background: none;
      border: 1px solid var(--border2);
      color: var(--red);
      font-family: var(--mono);
      font-size: 0.62rem;
      padding: 2px 7px;
      cursor: pointer;
      border-radius: var(--radius);
      white-space: nowrap;
      transition: border-color 0.15s;
    }
    .btn-block:hover { border-color: var(--red); }

    .status-bar {
      padding: 4px 14px;
      font-size: 0.68rem;
      color: var(--text-dim);
      font-family: var(--mono);
      flex-shrink: 0;
      min-height: 22px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }

    /* ── Tables ── */
    .table-wrap {
      flex: 1;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--border2) transparent;
    }
    table { width: 100%; border-collapse: collapse; }
    thead th {
      position: sticky; top: 0;
      background: var(--surface);
      padding: 5px 10px;
      text-align: left;
      color: var(--text-dim);
      font-size: 0.62rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
      z-index: 1;
    }
    tbody tr { border-bottom: 1px solid var(--border); transition: background 0.1s; }
    tbody tr:hover { background: var(--surface2); }
    tbody td { padding: 5px 10px; font-family: var(--mono); font-size: 0.72rem; vertical-align: middle; }
    tbody td.sans { font-family: var(--sans); }
    .trunc { max-width: 80px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      color: var(--text-dim);
      font-size: 0.75rem;
      gap: 8px;
    }
    .empty-state svg { opacity: 0.2; }

    /* ── Port / risk colours ── */
    .port-high { color: var(--red); font-weight: 600; }
    .port-med  { color: var(--amber); }
    .port-low  { color: var(--green); }
    .risk-high { color: var(--red); font-weight: 600; }
    .risk-med  { color: var(--amber); }
    .risk-low  { color: var(--green); }
    .risk-none { color: var(--text-dim); }

    /* ── CVE badge ── */
    .cve-badge {
      display: inline-block;
      font-size: 0.58rem;
      font-family: var(--mono);
      padding: 1px 4px;
      border: 1px solid;
      border-radius: 2px;
      margin-left: 5px;
      vertical-align: middle;
      cursor: default;
    }
    .cve-critical { color: var(--red);      border-color: rgba(255,59,59,0.5); background: rgba(255,59,59,0.07); }
    .cve-high     { color: var(--amber);    border-color: rgba(245,166,35,0.5); background: rgba(245,166,35,0.07); }
    .cve-medium   { color: var(--text-mid); border-color: rgba(107,135,170,0.4); background: transparent; }

    /* ── Blocked row ── */
    .row-blocked td { opacity: 0.35; text-decoration: line-through; }
    .row-blocked td:last-child { opacity: 1; text-decoration: none; }

    /* ── Event rows ── */
    @keyframes slideIn {
      from { background: rgba(0,232,135,0.07); }
      to   { background: transparent; }
    }
    .row-new { animation: slideIn 0.6s ease forwards; }
    @media (prefers-reduced-motion: reduce) { .row-new { animation: none; } }

    .row-threat td { border-left: 2px solid var(--red); background: var(--red-dim); color: var(--red); font-weight: 500; }
    .row-knock  td { border-left: 2px solid var(--purple); background: rgba(155,127,232,0.07); color: var(--purple); font-weight: 500; }

    @keyframes flashBorder {
      0%,100% { border-left-color: var(--red); }
      50%      { border-left-color: transparent; }
    }
    .row-threat-flash td:first-child { border-left: 2px solid var(--red); animation: flashBorder 0.4s ease 4; }

    /* ── Map panel (center) ── */
    #map-panel { display: flex; flex-direction: column; overflow: hidden; }
    #map { flex: 1; min-height: 0; }

    .map-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 5px 14px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      font-size: 0.67rem;
      color: var(--text-dim);
      font-family: var(--mono);
      flex-shrink: 0;
    }
    #blocked-count { color: var(--red); }

    /* ── Leaflet theme ── */
    .leaflet-popup-content-wrapper {
      background: var(--surface2) !important;
      color: var(--text) !important;
      border: 1px solid var(--border2) !important;
      border-radius: var(--radius) !important;
      box-shadow: 0 8px 32px rgba(0,0,0,0.6) !important;
      font-family: var(--mono) !important;
      font-size: 0.72rem !important;
    }
    .leaflet-popup-tip { background: var(--surface2) !important; }
    .leaflet-popup-close-button { color: var(--text-dim) !important; }
    .leaflet-tile-container img { filter: brightness(0.85) saturate(0.5) hue-rotate(185deg); }

    /* ── Discover results ── */
    #discover-results { display: none; flex-shrink: 0; }
    .discover-scan-btn {
      background: none;
      border: 1px solid var(--border2);
      color: var(--blue);
      font-family: var(--mono);
      font-size: 0.62rem;
      padding: 2px 7px;
      cursor: pointer;
      border-radius: var(--radius);
    }
    .discover-scan-btn:hover { border-color: var(--blue); }

    /* ── IP tag ── */
    .ip-link {
      color: var(--blue);
      cursor: pointer;
      text-decoration: none;
    }
    .ip-link:hover { text-decoration: underline; }

    /* ── Modal ── */
    #modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(2px);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }
    #modal-overlay.open { display: flex; }
    #modal {
      background: var(--surface2);
      border: 1px solid var(--border2);
      border-radius: var(--radius);
      width: 540px;
      max-height: 72vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 24px 64px rgba(0,0,0,0.7);
    }
    #modal-header {
      display: flex;
      align-items: center;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      gap: 12px;
      flex-shrink: 0;
    }
    #modal-ip {
      font-family: var(--mono);
      font-size: 1rem;
      color: var(--green);
      flex: 1;
    }
    #modal-close {
      background: none;
      border: none;
      color: var(--text-mid);
      cursor: pointer;
      font-size: 1rem;
      line-height: 1;
      padding: 2px 6px;
      border-radius: var(--radius);
      transition: background 0.1s;
    }
    #modal-close:hover { background: var(--surface3); color: var(--text); }
    #modal-body { overflow-y: auto; padding: 16px; flex: 1; }

    .modal-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px 20px;
      margin-bottom: 14px;
    }
    .modal-field { }
    .modal-label {
      font-size: 0.6rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 2px;
    }
    .modal-value {
      font-family: var(--mono);
      font-size: 0.78rem;
      color: var(--text);
    }
    .modal-actions { display: flex; gap: 8px; margin-bottom: 14px; }
    .modal-section-title {
      font-size: 0.6rem;
      font-weight: 600;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 8px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--border);
    }
  </style>
</head>
<body>

<!-- ── Header ── -->
<header>
  <div class="logo">
    <svg class="logo-mark" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="10" cy="10" r="9" stroke="#1e2d48" stroke-width="1.5"/>
      <circle cx="10" cy="10" r="5.5" stroke="#2a3d5e" stroke-width="1"/>
      <circle cx="10" cy="10" r="2" fill="#00e887"/>
      <line x1="10" y1="1" x2="10" y2="4.5" stroke="#00e887" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="10" y1="15.5" x2="10" y2="19" stroke="#1e2d48" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="1" y1="10" x2="4.5" y2="10" stroke="#1e2d48" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="15.5" y1="10" x2="19" y2="10" stroke="#1e2d48" stroke-width="1.5" stroke-linecap="round"/>
    </svg>
    <span class="logo-name">HoneyMap</span>
  </div>
  <div class="header-stats">
    <div class="hstat"><div class="hstat-label">Total hits</div><div class="hstat-value" id="stat-total">—</div></div>
    <div class="hstat"><div class="hstat-label">Unique IPs</div><div class="hstat-value" id="stat-unique">—</div></div>
    <div class="hstat"><div class="hstat-label">Top port</div><div class="hstat-value" id="stat-port">—</div></div>
    <div class="hstat"><div class="hstat-label">Top country</div><div class="hstat-value" id="stat-country">—</div></div>
    <div class="hstat"><div class="hstat-label">Last hour</div><div class="hstat-value" id="stat-hour">—</div></div>
  </div>
  <div class="header-right">
    <button class="btn-ghost" onclick="downloadCSV()">Export CSV</button>
    <div id="ws-pill">
      <div id="ws-dot"></div>
      <span id="ws-label">Connecting</span>
    </div>
  </div>
</header>

<!-- ── Rate bar ── -->
<div id="rate-bar">
  <span class="rate-label">hits/min</span>
</div>

<!-- ── Three-column main ── -->
<main>

  <!-- LEFT: Scanner + Discovery -->
  <div class="panel">
    <div class="panel-head">
      <div class="panel-head-dot"></div>
      <span class="panel-head-title">Port Scanner</span>
    </div>

    <form class="tool-row" id="scan-form" onsubmit="triggerScan(event)">
      <input class="tool-input" id="scan-host" type="text" placeholder="IP or hostname" value="127.0.0.1" autocomplete="off" spellcheck="false" />
      <button class="btn-primary" id="scan-btn" type="submit">Scan</button>
    </form>
    <div class="status-bar" id="scan-status"></div>

    <div class="table-wrap">
      <div class="empty-state" id="scan-empty">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
        </svg>
        Enter a target and scan
      </div>
      <table id="scan-table" style="display:none">
        <thead><tr><th>Port</th><th>Service</th><th>Version</th><th>CVE</th></tr></thead>
        <tbody id="scan-tbody"></tbody>
      </table>
    </div>

    <div class="divider">Network Discovery</div>
    <form class="tool-row" id="discover-form" onsubmit="triggerDiscover(event)">
      <input class="tool-input" id="discover-subnet" type="text" placeholder="192.168.1.0/24" autocomplete="off" spellcheck="false" />
      <button class="btn-secondary" id="discover-btn" type="submit">Sweep</button>
    </form>
    <div class="status-bar" id="discover-status"></div>
    <div id="discover-results">
      <div class="table-wrap" style="max-height: 130px">
        <table>
          <thead><tr><th>Live host</th><th></th></tr></thead>
          <tbody id="discover-tbody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- CENTER: Map -->
  <div id="map-panel">
    <div class="panel-head" style="border-right:1px solid var(--border)">
      <div class="panel-head-dot"></div>
      <span class="panel-head-title">Live Map</span>
      <div class="panel-head-actions">
        <button class="btn-mini" id="heatmap-btn" onclick="toggleHeatmap()">Heatmap</button>
      </div>
    </div>
    <div id="map"></div>
    <div class="map-footer">
      <span id="hit-count-text">0 hits captured</span>
      <span id="blocked-count"></span>
    </div>
  </div>

  <!-- RIGHT: Honeypot feed -->
  <div class="panel">
    <div class="panel-head">
      <div class="panel-head-dot"></div>
      <span class="panel-head-title">Honeypot Feed</span>
    </div>
    <div class="table-wrap" id="honey-table-wrap">
      <table>
        <thead>
          <tr>
            <th>Time</th><th>IP</th><th>Port</th><th>Country</th><th>Risk</th><th></th>
          </tr>
        </thead>
        <tbody id="honey-tbody"></tbody>
      </table>
    </div>
  </div>

</main>

<!-- ── IP Profile Modal ── -->
<div id="modal-overlay" onclick="closeModal(event)">
  <div id="modal">
    <div id="modal-header">
      <div id="modal-ip">—</div>
      <button id="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div id="modal-body"></div>
  </div>
</div>

<script>
const WS_URL   = 'ws://localhost:8000/ws';
const API_BASE = 'http://localhost:8000';
const MAX_ROWS = 50;

function _parseVer(v) {
  return String(v).split(/[.\-_]/).map(p => { const n = parseInt(p,10); return isNaN(n) ? 0 : n; });
}
function _verVulnerable(detected, fixed) {
  const a = _parseVer(detected), b = _parseVer(fixed);
  const len = Math.max(a.length, b.length);
  for (let i = 0; i < len; i++) {
    const ai = a[i]||0, bi = b[i]||0;
    if (ai < bi) return true;
    if (ai > bi) return false;
  }
  return true;
}
function cveMatch(cve, versionStr) {
  if (!versionStr) return false;
  if (!cve.product) return true;
  const v = versionStr.toLowerCase();
  if (!v.includes(cve.product.toLowerCase().split(' ')[0])) return false;
  if (!cve.fixed) return true;
  const m = versionStr.match(/(\d[\d.\-_p]+)/);
  if (!m) return true;
  return _verVulnerable(m[1], cve.fixed);
}

// ── State ─────────────────────────────────────────────────────────────────────
let ws = null;
let honeyCount = 0;
const ipRowMap   = {};
const blockedIPs = new Set();
let heatmapLayer  = null;
let heatmapActive = false;
const countryCounts = {};

// ── Map ───────────────────────────────────────────────────────────────────────
const map = L.map('map', { zoomControl: false }).setView([20, 0], 2);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
  maxZoom: 19,
}).addTo(map);
L.control.zoom({ position: 'bottomright' }).addTo(map);

// ── WebSocket ─────────────────────────────────────────────────────────────────
function connectWS() {
  ws = new WebSocket(WS_URL);
  ws.onopen = () => {
    document.getElementById('ws-dot').classList.add('connected');
    document.getElementById('ws-label').textContent = 'Live';
    loadHistory();
    loadBlocklist();
    loadTimeline();
  };
  ws.onmessage = (evt) => {
    try { handleMessage(JSON.parse(evt.data)); } catch(e) { console.warn('WS parse error', e); }
  };
  ws.onclose = () => {
    document.getElementById('ws-dot').classList.remove('connected');
    document.getElementById('ws-label').textContent = 'Reconnecting';
    setTimeout(connectWS, 3000);
  };
  ws.onerror = () => ws.close();
}

async function loadHistory() {
  try {
    const res = await fetch(`${API_BASE}/hits`);
    if (!res.ok) return;
    const hits = await res.json();
    [...hits].reverse().forEach(h => handleHoneypotHit({ ...h, type: 'honeypot_hit' }));
  } catch(_) {}
}
async function loadBlocklist() {
  try {
    const res = await fetch(`${API_BASE}/blocklist`);
    if (!res.ok) return;
    const data = await res.json();
    data.blocked.forEach(ip => { blockedIPs.add(ip); markRowBlocked(ip); });
    updateBlockedCount();
  } catch(_) {}
}
async function loadTimeline() {
  try {
    const res = await fetch(`${API_BASE}/hits/timeline?minutes=30`);
    if (!res.ok) return;
    renderRateGraph(await res.json());
  } catch(_) {}
}

// ── Message router ────────────────────────────────────────────────────────────
function handleMessage(msg) {
  switch(msg.type) {
    case 'honeypot_hit':      handleHoneypotHit(msg);      break;
    case 'scan_result':       handleScanResult(msg);       break;
    case 'threat_escalation': handleThreatEscalation(msg); break;
    case 'stats':             handleStats(msg);            break;
    case 'discover_host':     handleDiscoverHost(msg);     break;
    case 'discover_done':     handleDiscoverDone(msg);     break;
    case 'port_knock':        handlePortKnock(msg);        break;
    case 'ip_blocked':        onIpBlocked(msg.ip);         break;
    case 'ip_unblocked':      onIpUnblocked(msg.ip);       break;
  }
}

// ── Honeypot hit ──────────────────────────────────────────────────────────────
function handleHoneypotHit(msg) {
  if (msg.country) countryCounts[msg.country] = (countryCounts[msg.country] || 0) + 1;

  if (msg.lat != null && msg.lng != null && !heatmapActive) {
    const color = riskColor(msg.abuse_score);
    const blocked = blockedIPs.has(msg.ip);
    const marker = L.circleMarker([msg.lat, msg.lng], {
      radius: blocked ? 3 : 5,
      fillColor: blocked ? '#1e2d48' : color,
      color:     blocked ? '#1e2d48' : color,
      weight: 1.5, opacity: 1, fillOpacity: blocked ? 0.5 : 0.75,
    }).addTo(map);
    marker.bindPopup(
      `<b style="color:${color}">${esc(msg.ip)}</b><br>` +
      `Port <b>${msg.port}</b> · ${esc(msg.country || '—')}<br>` +
      `${esc(msg.isp || '—')}<br>` +
      (msg.rdns ? `${esc(msg.rdns)}<br>` : '') +
      `Risk: <b>${msg.abuse_score ?? 'unknown'}</b><br>` +
      `<span style="color:var(--blue);cursor:pointer" onclick="showProfile('${esc(msg.ip)}')">▸ View profile</span>`
    );
  }

  const tbody = document.getElementById('honey-tbody');
  const tr = document.createElement('tr');
  tr.className = 'row-new';
  tr.dataset.ip = msg.ip;
  if (blockedIPs.has(msg.ip)) tr.classList.add('row-blocked');

  const riskCls = abuseClass(msg.abuse_score);
  tr.innerHTML = `
    <td>${fmtTs(msg.ts)}</td>
    <td><span class="ip-link" onclick="showProfile('${esc(msg.ip)}')">${esc(msg.ip)}</span>${msg.hit_count > 1 ? ` <span style="color:var(--amber);font-size:0.62rem">×${msg.hit_count}</span>` : ''}</td>
    <td class="${portClass(msg.port)}">${msg.port}</td>
    <td class="sans trunc">${esc(msg.country || '—')}</td>
    <td class="${riskCls}">${msg.abuse_score ?? '—'}</td>
    <td><button class="btn-block" onclick="toggleBlock('${esc(msg.ip)}', this)">${blockedIPs.has(msg.ip) ? 'Unblock' : 'Block'}</button></td>
  `;
  tbody.insertBefore(tr, tbody.firstChild);
  ipRowMap[msg.ip] = tr;
  while (tbody.rows.length > MAX_ROWS) tbody.deleteRow(tbody.rows.length - 1);

  honeyCount++;
  document.getElementById('hit-count-text').textContent = `${honeyCount} hit${honeyCount !== 1 ? 's' : ''} captured`;
}

// ── Block / Unblock ───────────────────────────────────────────────────────────
async function toggleBlock(ip, btn) {
  const blocking = !blockedIPs.has(ip);
  try {
    const res = await fetch(`${API_BASE}/${blocking ? 'block' : 'unblock'}`, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ip}),
    });
    if (!res.ok) throw new Error();
  } catch(_) {}
}

function onIpBlocked(ip) {
  blockedIPs.add(ip);
  markRowBlocked(ip, true);
  updateBlockedCount();
}
function onIpUnblocked(ip) {
  blockedIPs.delete(ip);
  markRowBlocked(ip, false);
  updateBlockedCount();
}
function markRowBlocked(ip, blocked = true) {
  const tr = ipRowMap[ip];
  if (!tr) return;
  const btn = tr.querySelector('.btn-block');
  if (blocked) { tr.classList.add('row-blocked'); if (btn) btn.textContent = 'Unblock'; }
  else         { tr.classList.remove('row-blocked'); if (btn) btn.textContent = 'Block'; }
}
function updateBlockedCount() {
  const el = document.getElementById('blocked-count');
  el.textContent = blockedIPs.size > 0 ? `${blockedIPs.size} blocked` : '';
}

// ── Threat escalation ─────────────────────────────────────────────────────────
function handleThreatEscalation(msg) {
  const existing = ipRowMap[msg.ip];
  if (existing) { existing.classList.remove('row-threat-flash'); void existing.offsetWidth; existing.classList.add('row-threat-flash'); }
  const tr = document.createElement('tr');
  tr.className = 'row-threat';
  tr.innerHTML = `<td colspan="6" class="sans">⚠ Persistent attacker — ${esc(msg.ip)} · ${msg.hit_count} hits</td>`;
  document.getElementById('honey-tbody').insertBefore(tr, document.getElementById('honey-tbody').firstChild);
}

// ── Port knock ────────────────────────────────────────────────────────────────
function handlePortKnock(msg) {
  const tr = document.createElement('tr');
  tr.className = 'row-knock';
  tr.innerHTML = `<td colspan="6" class="sans">◈ Port scan — ${esc(msg.ip)} probed ${msg.ports.join(', ')}</td>`;
  document.getElementById('honey-tbody').insertBefore(tr, document.getElementById('honey-tbody').firstChild);
}

// ── Stats ─────────────────────────────────────────────────────────────────────
function handleStats(msg) {
  document.getElementById('stat-total').textContent   = msg.total_hits     ?? '—';
  document.getElementById('stat-unique').textContent  = msg.unique_ips     ?? '—';
  document.getElementById('stat-port').textContent    = msg.top_port       ?? '—';
  document.getElementById('stat-country').textContent = msg.top_country    ?? '—';
  document.getElementById('stat-hour').textContent    = msg.hits_last_hour ?? '—';
  loadTimeline();
}

// ── Rate graph ────────────────────────────────────────────────────────────────
function renderRateGraph(buckets) {
  const bar = document.getElementById('rate-bar');
  [...bar.querySelectorAll('.rate-col')].forEach(el => el.remove());
  const max = Math.max(1, ...buckets.map(b => b.count));
  const now = Math.floor(Date.now() / 60000) * 60;
  buckets.forEach(b => {
    const col = document.createElement('div');
    col.className = 'rate-col' + (b.ts === now ? ' active' : '');
    col.style.height = `${Math.max(2, (b.count / max) * 18)}px`;
    col.title = `${b.count} hits at ${new Date(b.ts*1000).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}`;
    bar.appendChild(col);
  });
}

// ── Heatmap ───────────────────────────────────────────────────────────────────
async function toggleHeatmap() {
  heatmapActive = !heatmapActive;
  const btn = document.getElementById('heatmap-btn');
  btn.style.color = heatmapActive ? 'var(--amber)' : '';
  btn.style.borderColor = heatmapActive ? 'var(--amber)' : '';
  if (heatmapLayer) { map.removeLayer(heatmapLayer); heatmapLayer = null; }
  if (!heatmapActive) return;
  try {
    const res = await fetch('https://raw.githubusercontent.com/datasets/geo-countries/master/data/countries.geojson');
    const geo = await res.json();
    const maxCount = Math.max(1, ...Object.values(countryCounts));
    heatmapLayer = L.geoJSON(geo, {
      style: (f) => {
        const count = countryCounts[f.properties.ADMIN] || 0;
        const i = count / maxCount;
        return { fillColor: count === 0 ? 'transparent' : `rgba(255,59,59,${0.1 + i * 0.8})`, weight: 0.5, color: '#1e2d48', fillOpacity: 1 };
      },
      onEachFeature: (f, layer) => {
        const count = countryCounts[f.properties.ADMIN] || 0;
        if (count > 0) layer.bindPopup(`${f.properties.ADMIN}: ${count} hit${count!==1?'s':''}`);
      }
    }).addTo(map);
  } catch(e) {
    console.warn('GeoJSON failed', e);
    heatmapActive = false;
  }
}

// ── Scan result ───────────────────────────────────────────────────────────────
function handleScanResult(msg) {
  const empty = document.getElementById('scan-empty');
  const table = document.getElementById('scan-table');
  const tbody = document.getElementById('scan-tbody');
  tbody.innerHTML = '';
  if (!msg.ports || msg.ports.length === 0) {
    empty.style.display = 'flex';
    empty.querySelector('span') ? null : null;
    empty.innerHTML = `<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg> No open ports on ${esc(msg.host)}`;
    table.style.display = 'none';
    return;
  }
  empty.style.display = 'none';
  table.style.display = 'table';
  for (const p of msg.ports) {
    const allCves = CVE[p.service] || [];
    const cves = allCves.filter(c => cveMatch(c, p.version));
    const cveBadges = cves.map(c =>
      `<span class="cve-badge cve-${c.severity}" title="${esc(c.desc)}">${esc(c.id)}</span>`
    ).join('');
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td class="${portClass(p.port)}">${p.port}</td>
      <td class="sans">${esc(p.service||'—')}${cveBadges}</td>
      <td style="color:var(--text-mid);font-size:0.68rem">${esc(p.version||'—')}</td>
      <td>${cves.length > 0 ? `<span style="color:var(--red);font-size:0.68rem">⚠ ${cves.length}</span>` : ''}</td>
    `;
    tbody.appendChild(tr);
  }
  document.getElementById('scan-status').textContent =
    `${msg.ports.length} open port${msg.ports.length!==1?'s':''} on ${msg.host}`;
}

// ── Scan form ─────────────────────────────────────────────────────────────────
async function triggerScan(evt) {
  evt.preventDefault();
  const host = document.getElementById('scan-host').value.trim();
  if (!host) return;
  const btn = document.getElementById('scan-btn');
  const status = document.getElementById('scan-status');
  btn.disabled = true;
  status.textContent = `Scanning ${host}…`;
  try {
    const res = await fetch(`${API_BASE}/scan`, {
      method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({host}),
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
  } catch(e) {
    status.textContent = `Scan failed: ${e.message}`;
  } finally {
    btn.disabled = false;
  }
}

// ── Discovery ─────────────────────────────────────────────────────────────────
function handleDiscoverHost(msg) {
  document.getElementById('discover-results').style.display = 'block';
  const tr = document.createElement('tr');
  tr.innerHTML = `<td>${esc(msg.ip)}</td><td><button class="discover-scan-btn" onclick="scanFromDiscover('${esc(msg.ip)}')">scan</button></td>`;
  document.getElementById('discover-tbody').appendChild(tr);
}
function handleDiscoverDone(msg) {
  document.getElementById('discover-status').textContent = `${msg.total} host${msg.total!==1?'s':''} found on ${msg.subnet}`;
  document.getElementById('discover-btn').disabled = false;
}
function scanFromDiscover(ip) {
  document.getElementById('scan-host').value = ip;
  document.getElementById('scan-form').dispatchEvent(new Event('submit', {cancelable:true, bubbles:true}));
}
async function triggerDiscover(evt) {
  evt.preventDefault();
  const subnet = document.getElementById('discover-subnet').value.trim();
  if (!subnet) return;
  const btn = document.getElementById('discover-btn');
  btn.disabled = true;
  document.getElementById('discover-tbody').innerHTML = '';
  document.getElementById('discover-results').style.display = 'none';
  document.getElementById('discover-status').textContent = `Sweeping ${subnet}…`;
  try {
    const res = await fetch(`${API_BASE}/discover`, {
      method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({subnet}),
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
  } catch(e) {
    document.getElementById('discover-status').textContent = `Failed: ${e.message}`;
    btn.disabled = false;
  }
}

// ── IP Profile Modal ──────────────────────────────────────────────────────────
async function showProfile(ip) {
  document.getElementById('modal-ip').textContent = ip;
  document.getElementById('modal-body').innerHTML = '<p style="color:var(--text-dim);font-size:0.78rem;padding:8px 0">Loading…</p>';
  document.getElementById('modal-overlay').classList.add('open');
  try {
    const res = await fetch(`${API_BASE}/ip/${encodeURIComponent(ip)}`);
    const data = await res.json();
    const blocked = blockedIPs.has(ip);
    const latest = data.hits[0] || {};
    document.getElementById('modal-body').innerHTML = `
      <div class="modal-grid">
        <div class="modal-field"><div class="modal-label">Country</div><div class="modal-value">${esc(latest.country||'—')}</div></div>
        <div class="modal-field"><div class="modal-label">ISP</div><div class="modal-value">${esc(latest.isp||'—')}</div></div>
        <div class="modal-field"><div class="modal-label">rDNS</div><div class="modal-value">${esc(latest.rdns||'—')}</div></div>
        <div class="modal-field"><div class="modal-label">Abuse score</div><div class="modal-value ${abuseClass(latest.abuse_score)}">${latest.abuse_score??'—'}</div></div>
        <div class="modal-field"><div class="modal-label">Total hits</div><div class="modal-value">${data.hits.length}</div></div>
        <div class="modal-field"><div class="modal-label">Status</div><div class="modal-value" style="color:${blocked?'var(--red)':'var(--green)'}">${blocked?'Blocked':'Active'}</div></div>
      </div>
      <div class="modal-actions">
        <button class="btn-block" onclick="toggleBlock('${esc(ip)}',this);closeModal()">${blocked?'Unblock':'Block'}</button>
      </div>
      <div class="modal-section-title">Hit history</div>
      <table>
        <thead><tr><th>Time</th><th>Port</th><th>Banner</th></tr></thead>
        <tbody>
          ${data.hits.slice(0,20).map(h=>`
            <tr>
              <td>${fmtTs(h.ts)}</td>
              <td class="${portClass(h.port)}">${h.port}</td>
              <td class="trunc sans">${h.banner?esc(h.banner):'<span style="color:var(--text-dim)">—</span>'}</td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    `;
  } catch(_) {
    document.getElementById('modal-body').innerHTML = '<p style="color:var(--red);padding:8px 0">Failed to load.</p>';
  }
}
function closeModal(evt) {
  if (evt && evt.target !== document.getElementById('modal-overlay')) return;
  document.getElementById('modal-overlay').classList.remove('open');
}

// ── CSV ───────────────────────────────────────────────────────────────────────
function downloadCSV() { window.location.href = `${API_BASE}/export/csv`; }

// ── Helpers ───────────────────────────────────────────────────────────────────
function portClass(port) {
  if ([21,22,23,445,3389].includes(port)) return 'port-high';
  if ([80,443,8080,8443].includes(port))  return 'port-med';
  return 'port-low';
}
function riskColor(score) {
  if (score == null) return 'var(--amber)';
  if (score >= 70)   return 'var(--red)';
  if (score >= 30)   return 'var(--amber)';
  return 'var(--green)';
}
function abuseClass(score) {
  if (score == null) return 'risk-none';
  if (score >= 70)   return 'risk-high';
  if (score >= 30)   return 'risk-med';
  return 'risk-low';
}
function fmtTs(ts) {
  return new Date(ts*1000).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit'});
}
function esc(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
