<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HoneyMap</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    :root {
      --bg:        #070B14;
      --surface:   #0C1220;
      --surface2:  #111827;
      --border:    #1a2440;
      --border2:   #243050;
      --text:      #C8D8F0;
      --text-dim:  #4A6080;
      --text-mid:  #7A96B8;
      --green:     #00FF9C;
      --green-dim: #00CC7A;
      --red:       #FF3B30;
      --amber:     #FFB340;
      --blue:      #4D9FFF;
      --purple:    #A78BFA;
      --mono:      'JetBrains Mono', monospace;
      --sans:      'Inter', system-ui, sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--sans); background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    /* ── Header ── */
    header { display: flex; align-items: center; gap: 16px; padding: 0 20px; height: 42px; background: var(--surface); border-bottom: 1px solid var(--border); flex-shrink: 0; }
    .logo { display: flex; align-items: center; gap: 9px; }
    .logo-mark { width: 22px; height: 22px; flex-shrink: 0; }
    header h1 { font-size: 0.9rem; font-weight: 600; letter-spacing: 0.02em; color: var(--text); }
    .header-actions { margin-left: auto; display: flex; align-items: center; gap: 12px; }
    #ws-status { display: flex; align-items: center; gap: 8px; font-size: 0.72rem; color: var(--text-mid); }
    #ws-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--red); transition: background 0.4s; }
    #ws-dot.connected { background: var(--green); box-shadow: 0 0 6px var(--green); animation: pulse 2.4s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { box-shadow: 0 0 4px var(--green); } 50% { box-shadow: 0 0 10px var(--green); } }
    @media (prefers-reduced-motion: reduce) { #ws-dot.connected { animation: none; } }

    .btn-header { background: none; border: 1px solid var(--border2); color: var(--text-mid); font-family: var(--sans); font-size: 0.72rem; padding: 4px 10px; cursor: pointer; transition: border-color 0.15s, color 0.15s; }
    .btn-header:hover { border-color: var(--green); color: var(--green); }

    /* ── Stats strip ── */
    #stats-strip { display: flex; background: var(--surface); border-bottom: 1px solid var(--border); flex-shrink: 0; }
    .stat-cell { flex: 1; padding: 10px 20px; border-right: 1px solid var(--border); }
    .stat-cell:last-child { border-right: none; }
    .stat-label { font-size: 0.65rem; font-weight: 500; color: var(--text-dim); margin-bottom: 2px; }
    .stat-value { font-family: var(--mono); font-size: 1.05rem; font-weight: 500; color: var(--green); line-height: 1; }

    /* ── Rate graph ── */
    #rate-bar { background: var(--surface); border-bottom: 1px solid var(--border); padding: 6px 20px; flex-shrink: 0; display: flex; align-items: flex-end; gap: 2px; height: 38px; }
    .rate-bar-label { font-size: 0.6rem; color: var(--text-dim); margin-right: 6px; align-self: center; white-space: nowrap; }
    .rate-col { flex: 1; background: var(--border); transition: height 0.3s, background 0.3s; min-height: 2px; position: relative; }
    .rate-col.active { background: var(--green); }

    /* ── Main grid ── */
    main { flex: 1; display: grid; grid-template-columns: 1fr 1fr; overflow: hidden; }
    .panel { background: var(--bg); display: flex; flex-direction: column; overflow: hidden; border-right: 1px solid var(--border); }
    .panel:last-child { border-right: none; }
    .panel-title { padding: 9px 16px; background: var(--surface); border-bottom: 1px solid var(--border); font-size: 0.72rem; font-weight: 600; color: var(--text-mid); flex-shrink: 0; display: flex; align-items: center; gap: 7px; }
    .panel-title .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--green); flex-shrink: 0; }
    .panel-title-actions { margin-left: auto; display: flex; gap: 6px; }

    /* ── Forms ── */
    .tool-row { display: flex; gap: 8px; padding: 10px 14px; flex-shrink: 0; border-bottom: 1px solid var(--border); background: var(--surface2); }
    .tool-input { flex: 1; background: var(--bg); border: 1px solid var(--border2); color: var(--text); padding: 6px 10px; font-family: var(--mono); font-size: 0.8rem; outline: none; transition: border-color 0.2s; }
    .tool-input:focus { border-color: var(--blue); }
    .tool-input::placeholder { color: var(--text-dim); }
    .btn-primary { background: var(--green); border: none; color: var(--bg); font-family: var(--sans); font-weight: 600; font-size: 0.78rem; padding: 6px 14px; cursor: pointer; white-space: nowrap; transition: background 0.15s; }
    .btn-primary:hover { background: var(--green-dim); }
    .btn-primary:disabled { opacity: 0.35; cursor: not-allowed; }
    .btn-secondary { background: var(--surface2); border: 1px solid var(--border2); color: var(--text-mid); font-family: var(--sans); font-weight: 500; font-size: 0.78rem; padding: 6px 12px; cursor: pointer; white-space: nowrap; transition: border-color 0.15s, color 0.15s; }
    .btn-secondary:hover { border-color: var(--blue); color: var(--blue); }
    .btn-secondary:disabled { opacity: 0.35; cursor: not-allowed; }
    .btn-danger { background: none; border: 1px solid var(--border2); color: var(--red); font-family: var(--mono); font-size: 0.67rem; padding: 2px 7px; cursor: pointer; transition: border-color 0.15s; white-space: nowrap; }
    .btn-danger:hover { border-color: var(--red); }
    .btn-icon { background: none; border: 1px solid var(--border2); color: var(--text-mid); font-family: var(--mono); font-size: 0.67rem; padding: 2px 7px; cursor: pointer; transition: border-color 0.15s, color 0.15s; white-space: nowrap; }
    .btn-icon:hover { border-color: var(--green); color: var(--green); }
    .status-line { padding: 4px 14px; font-size: 0.71rem; color: var(--text-dim); flex-shrink: 0; min-height: 22px; font-family: var(--mono); }
    .section-divider { display: flex; align-items: center; gap: 10px; padding: 7px 14px; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); background: var(--surface); font-size: 0.67rem; font-weight: 600; color: var(--text-dim); flex-shrink: 0; }

    /* ── Tables ── */
    .table-wrap { flex: 1; overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--border2) transparent; }
    table { width: 100%; border-collapse: collapse; font-size: 0.74rem; }
    thead th { position: sticky; top: 0; background: var(--surface); padding: 6px 10px; text-align: left; color: var(--text-dim); font-weight: 500; font-size: 0.67rem; border-bottom: 1px solid var(--border); white-space: nowrap; z-index: 1; }
    tbody tr { border-bottom: 1px solid var(--border); transition: background 0.1s; }
    tbody tr:hover { background: var(--surface2); }
    tbody td { padding: 4px 10px; font-family: var(--mono); font-size: 0.73rem; vertical-align: middle; }
    tbody td.text { font-family: var(--sans); }
    .trunc { max-width: 90px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .port-high { color: var(--red); font-weight: 500; }
    .port-med  { color: var(--amber); }
    .port-low  { color: var(--green); }
    .abuse-high { color: var(--red); font-weight: 500; }
    .abuse-med  { color: var(--amber); }
    .abuse-low  { color: var(--green); }
    .abuse-none { color: var(--text-dim); }

    /* CVE badge */
    .cve-badge { display: inline-block; font-size: 0.6rem; padding: 1px 4px; border: 1px solid; margin-left: 4px; vertical-align: middle; }
    .cve-critical { color: var(--red); border-color: var(--red); }
    .cve-high     { color: var(--amber); border-color: var(--amber); }
    .cve-medium   { color: var(--text-mid); border-color: var(--text-mid); }

    /* Blocked row */
    .row-blocked td { opacity: 0.4; text-decoration: line-through; }
    .row-blocked td:last-child { opacity: 1; text-decoration: none; }

    #scan-empty { padding: 32px 20px; color: var(--text-dim); font-size: 0.78rem; text-align: center; font-family: var(--sans); }

    /* ── Discover ── */
    #discover-results { display: none; flex-shrink: 0; }
    .discover-scan-btn { background: none; border: 1px solid var(--border2); color: var(--blue); font-family: var(--mono); font-size: 0.67rem; padding: 2px 7px; cursor: pointer; }
    .discover-scan-btn:hover { border-color: var(--blue); }

    /* ── Map ── */
    #map { height: 260px; min-height: 260px; flex-shrink: 0; }
    .leaflet-popup-content-wrapper { background: var(--surface) !important; color: var(--text) !important; border: 1px solid var(--border2) !important; border-radius: 0 !important; box-shadow: 0 4px 16px rgba(0,0,0,0.5) !important; font-family: var(--mono) !important; font-size: 0.73rem !important; }
    .leaflet-popup-tip { background: var(--surface) !important; }
    .leaflet-popup-close-button { color: var(--text-dim) !important; }

    #honey-counter { padding: 4px 14px; font-size: 0.67rem; color: var(--text-dim); font-family: var(--mono); display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; border-bottom: 1px solid var(--border); }

    /* ── Animations ── */
    @keyframes slideIn { from { opacity:0; background:rgba(0,255,156,0.06); } to { opacity:1; background:transparent; } }
    .row-new { animation: slideIn 0.5s ease forwards; }
    @media (prefers-reduced-motion: reduce) { .row-new { animation: none; } }
    .threat-row td { border-left: 2px solid var(--red); color: var(--red); font-weight: 500; }
    .knock-row td  { border-left: 2px solid var(--purple); color: var(--purple); font-weight: 500; }
    @keyframes flashBorder { 0%,100% { border-left-color: var(--red); } 50% { border-left-color: transparent; } }
    .threat-flash td:first-child { border-left: 2px solid var(--red); animation: flashBorder 0.4s ease 4; }

    /* ── IP Profile Modal ── */
    #modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 1000; align-items: center; justify-content: center; }
    #modal-overlay.open { display: flex; }
    #modal { background: var(--surface); border: 1px solid var(--border2); width: 560px; max-height: 70vh; display: flex; flex-direction: column; }
    #modal-header { display: flex; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--border); gap: 12px; flex-shrink: 0; }
    #modal-title { font-family: var(--mono); font-size: 0.9rem; color: var(--green); flex: 1; }
    #modal-close { background: none; border: none; color: var(--text-mid); cursor: pointer; font-size: 1rem; }
    #modal-close:hover { color: var(--text); }
    #modal-body { overflow-y: auto; padding: 14px 16px; flex: 1; }
    .modal-field { margin-bottom: 8px; font-size: 0.78rem; }
    .modal-field span { color: var(--text-dim); margin-right: 6px; font-family: var(--sans); }
    .modal-field b { font-family: var(--mono); }
    #modal-hits-table { margin-top: 12px; }

  </style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-mark">
      <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
        <circle cx="11" cy="11" r="10" stroke="#1a2440" stroke-width="1.5"/>
        <circle cx="11" cy="11" r="6" stroke="#243050" stroke-width="1"/>
        <circle cx="11" cy="11" r="2.5" fill="#00FF9C"/>
        <line x1="11" y1="1" x2="11" y2="5" stroke="#00FF9C" stroke-width="1.5" stroke-linecap="round"/>
        <line x1="11" y1="17" x2="11" y2="21" stroke="#1a2440" stroke-width="1.5" stroke-linecap="round"/>
        <line x1="1" y1="11" x2="5" y2="11" stroke="#1a2440" stroke-width="1.5" stroke-linecap="round"/>
        <line x1="17" y1="11" x2="21" y2="11" stroke="#1a2440" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
    </div>
    <h1>HoneyMap</h1>
  </div>
  <div class="header-actions">
    <button class="btn-header" onclick="downloadCSV()">Export CSV</button>
    <div id="ws-status">
      <div id="ws-dot"></div>
      <span id="ws-label">Connecting</span>
    </div>
  </div>
</header>

<div id="stats-strip">
  <div class="stat-cell"><div class="stat-label">Total hits</div><div class="stat-value" id="stat-total">—</div></div>
  <div class="stat-cell"><div class="stat-label">Unique IPs</div><div class="stat-value" id="stat-unique">—</div></div>
  <div class="stat-cell"><div class="stat-label">Top port</div><div class="stat-value" id="stat-port">—</div></div>
  <div class="stat-cell"><div class="stat-label">Top country</div><div class="stat-value" id="stat-country">—</div></div>
  <div class="stat-cell"><div class="stat-label">Last hour</div><div class="stat-value" id="stat-hour">—</div></div>
</div>

<!-- Rate graph -->
<div id="rate-bar">
  <span class="rate-bar-label">hits/min</span>
</div>

<main>
  <!-- LEFT — Scanner -->
  <div class="panel">
    <div class="panel-title"><span class="dot"></span>Port scanner</div>

    <form class="tool-row" id="scan-form" onsubmit="triggerScan(event)">
      <input class="tool-input" id="scan-host" type="text" placeholder="IP or hostname" value="127.0.0.1" autocomplete="off" spellcheck="false" />
      <button class="btn-primary" id="scan-btn" type="submit">Scan</button>
    </form>
    <div class="status-line" id="scan-status"></div>

    <div class="table-wrap">
      <div id="scan-empty">Enter a target and scan.</div>
      <table id="scan-table" style="display:none">
        <thead><tr><th>Port</th><th>Service</th><th>Version</th><th>CVE</th></tr></thead>
        <tbody id="scan-tbody"></tbody>
      </table>
    </div>

    <div class="section-divider">Network discovery</div>
    <form class="tool-row" id="discover-form" onsubmit="triggerDiscover(event)">
      <input class="tool-input" id="discover-subnet" type="text" placeholder="192.168.1.0/24" autocomplete="off" spellcheck="false" />
      <button class="btn-secondary" id="discover-btn" type="submit">Sweep</button>
    </form>
    <div class="status-line" id="discover-status"></div>
    <div id="discover-results">
      <div class="table-wrap" style="max-height:120px">
        <table>
          <thead><tr><th>Live host</th><th></th></tr></thead>
          <tbody id="discover-tbody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- RIGHT — Honeypot feed -->
  <div class="panel">
    <div class="panel-title">
      <span class="dot"></span>Honeypot feed
      <div class="panel-title-actions">
        <button class="btn-icon" id="heatmap-btn" onclick="toggleHeatmap()">Heatmap</button>
      </div>
    </div>
    <div id="map"></div>
    <div id="honey-counter">
      <span id="honey-count-text">0 hits captured</span>
      <span id="blocked-count-text" style="color:var(--red)"></span>
    </div>
    <div class="table-wrap" id="honey-table-wrap">
      <table>
        <thead>
          <tr>
            <th>Time</th><th>IP</th><th>Port</th><th>Country</th>
            <th>ISP</th><th>rDNS</th><th>Banner</th><th>Risk</th><th></th>
          </tr>
        </thead>
        <tbody id="honey-tbody"></tbody>
      </table>
    </div>
  </div>
</main>

<!-- IP Profile Modal -->
<div id="modal-overlay" onclick="closeModal(event)">
  <div id="modal">
    <div id="modal-header">
      <div id="modal-title">—</div>
      <button id="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div id="modal-body"></div>
  </div>
</div>

<script>
const WS_URL   = 'ws://localhost:8000/ws';
const API_BASE = 'http://localhost:8000';
const MAX_ROWS = 50;

// ── CVE data ─────────────────────────────────────────────────────────────────
// product: substring matched against nmap version string (case-insensitive)
// fixed_version: last vulnerable version (null = affects all known versions)
const CVE = {
  ssh:    [{id:'CVE-2023-38408',desc:'OpenSSH agent hijack',        severity:'critical',product:'OpenSSH',      fixed:'9.3p2'}],
  http:   [{id:'CVE-2021-41773',desc:'Apache path traversal',       severity:'critical',product:'Apache httpd', fixed:'2.4.50'},
           {id:'CVE-2021-42013',desc:'Apache path traversal bypass',severity:'critical',product:'Apache httpd', fixed:'2.4.51'}],
  https:  [{id:'CVE-2022-0778', desc:'OpenSSL infinite loop',       severity:'high',    product:'OpenSSL',      fixed:'3.0.2'},
           {id:'CVE-2014-0160', desc:'Heartbleed',                  severity:'critical',product:'OpenSSL',      fixed:'1.0.1g'}],
  ftp:    [{id:'CVE-2022-22836',desc:'CoreFTP dir traversal',       severity:'high',    product:'CoreFTP',      fixed:'2.0'}],
  telnet: [{id:'CVE-1999-0619', desc:'Cleartext credentials',       severity:'critical',product:null,           fixed:null}],
  smb:    [{id:'CVE-2017-0144', desc:'EternalBlue/WannaCry',        severity:'critical',product:'Samba',        fixed:'4.6.4'},
           {id:'CVE-2017-7494', desc:'SambaCry RCE',                severity:'critical',product:'Samba',        fixed:'4.6.4'}],
  rdp:    [{id:'CVE-2019-0708', desc:'BlueKeep RCE',                severity:'critical',product:null,           fixed:null},
           {id:'CVE-2019-1182', desc:'DejaBlue RCE',                severity:'critical',product:null,           fixed:null}],
  mysql:  [{id:'CVE-2012-2122', desc:'Auth bypass via timing',      severity:'high',    product:'MySQL',        fixed:'5.6.6'},
           {id:'CVE-2016-6662', desc:'Config file injection',       severity:'critical',product:'MySQL',        fixed:'5.7.15'}],
  'ms-sql':[{id:'CVE-2020-0618',desc:'SSRS RCE',                   severity:'critical',product:'Microsoft SQL', fixed:null}],
  vnc:    [{id:'CVE-2006-2369', desc:'RealVNC auth bypass',         severity:'high',    product:'RealVNC',      fixed:'4.1.2'},
           {id:'CVE-2019-15694',desc:'TigerVNC buffer overflow',    severity:'high',    product:'TigerVNC',     fixed:'1.10.1'}],
  redis:  [{id:'CVE-2022-0543', desc:'Lua sandbox escape',          severity:'critical',product:'Redis',        fixed:'6.2.7'}],
  mongodb:[{id:'CVE-2013-4650', desc:'No auth by default',          severity:'medium',  product:'MongoDB',      fixed:'2.4.6'}],
  pop3:   [{id:'CVE-2003-0161', desc:'Sendmail buffer overflow',    severity:'high',    product:'Sendmail',     fixed:'8.12.9'}],
  imap:   [{id:'CVE-2021-33582',desc:'Cyrus IMAP DoS',              severity:'medium',  product:'Cyrus IMAP',   fixed:'3.4.3'}],
  smtp:   [{id:'CVE-2020-28017',desc:'Exim heap overflow',          severity:'critical',product:'Exim',         fixed:'4.94.2'},
           {id:'CVE-2021-27135',desc:'Postfix SMTP smuggling',      severity:'medium',  product:'Postfix',      fixed:'3.5.14'}],
  dns:    [{id:'CVE-2020-1350', desc:'SIGRed Windows DNS RCE',      severity:'critical',product:'Microsoft DNS', fixed:null},
           {id:'CVE-2021-25216',desc:'BIND9 buffer overflow',       severity:'critical',product:'BIND',         fixed:'9.11.31'}],
};

// Parse a version string like "2.4.49", "9.3p1", "1.0.1e" into a comparable tuple.
function _parseVer(v) {
  // split on dots and non-numeric suffixes; keep numeric parts only
  return String(v).split(/[.\-_]/).map(p => {
    const n = parseInt(p, 10);
    return isNaN(n) ? 0 : n;
  });
}

// Returns true if detectedVer <= fixedVer (i.e. still in vulnerable range).
function _verVulnerable(detected, fixed) {
  const a = _parseVer(detected);
  const b = _parseVer(fixed);
  const len = Math.max(a.length, b.length);
  for (let i = 0; i < len; i++) {
    const ai = a[i] || 0, bi = b[i] || 0;
    if (ai < bi) return true;   // older than fixed → vulnerable
    if (ai > bi) return false;  // newer than fixed → patched
  }
  return true; // equal to fixed_version means still vulnerable (fix is *after* this)
}

// Given a CVE entry and the nmap version string, return true if the CVE applies.
function cveMatch(cve, versionStr) {
  if (!versionStr) return false;            // no version info → can't confirm
  if (!cve.product) return true;            // protocol-level CVE (telnet, rdp) — always show
  const v = versionStr.toLowerCase();
  const prod = cve.product.toLowerCase();
  if (!v.includes(prod.split(' ')[0])) return false;  // product not present in version string
  if (!cve.fixed) return true;              // no fixed version known → assume vulnerable
  // Extract the version number portion after the product name
  const numMatch = versionStr.match(/(\d[\d.\-_p]+)/);
  if (!numMatch) return true;               // has the product but no parseable version → show it
  return _verVulnerable(numMatch[1], cve.fixed);
}

// ── State ────────────────────────────────────────────────────────────────────
let ws = null;
let honeyCount = 0;
const ipRowMap  = {};
const blockedIPs = new Set();
let heatmapLayer = null;
let heatmapActive = false;
const countryCounts = {};

// ── Map ───────────────────────────────────────────────────────────────────────
const map = L.map('map', { zoomControl: false }).setView([20, 0], 2);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
  maxZoom: 19,
}).addTo(map);
L.control.zoom({ position: 'bottomright' }).addTo(map);

// ── WebSocket ─────────────────────────────────────────────────────────────────
function connectWS() {
  ws = new WebSocket(WS_URL);
  ws.onopen = () => {
    document.getElementById('ws-dot').classList.add('connected');
    document.getElementById('ws-label').textContent = 'Live';
    loadHistory();
    loadBlocklist();
    loadTimeline();
  };
  ws.onmessage = (evt) => {
    try { handleMessage(JSON.parse(evt.data)); }
    catch(e) { console.warn('WS parse error', e); }
  };
  ws.onclose = () => {
    document.getElementById('ws-dot').classList.remove('connected');
    document.getElementById('ws-label').textContent = 'Reconnecting';
    setTimeout(connectWS, 3000);
  };
  ws.onerror = () => ws.close();
}

async function loadHistory() {
  try {
    const res = await fetch(`${API_BASE}/hits`);
    if (!res.ok) return;
    const hits = await res.json();
    [...hits].reverse().forEach(h => handleHoneypotHit({ ...h, type: 'honeypot_hit' }));
  } catch(_) {}
}

async function loadBlocklist() {
  try {
    const res = await fetch(`${API_BASE}/blocklist`);
    if (!res.ok) return;
    const data = await res.json();
    data.blocked.forEach(ip => {
      blockedIPs.add(ip);
      markRowBlocked(ip);
    });
    updateBlockedCount();
  } catch(_) {}
}

async function loadTimeline() {
  try {
    const res = await fetch(`${API_BASE}/hits/timeline?minutes=30`);
    if (!res.ok) return;
    const data = await res.json();
    renderRateGraph(data);
  } catch(_) {}
}

// ── Message router ────────────────────────────────────────────────────────────
function handleMessage(msg) {
  switch(msg.type) {
    case 'honeypot_hit':      handleHoneypotHit(msg);      break;
    case 'scan_result':       handleScanResult(msg);       break;
    case 'threat_escalation': handleThreatEscalation(msg); break;
    case 'stats':             handleStats(msg);            break;
    case 'discover_host':     handleDiscoverHost(msg);     break;
    case 'discover_done':     handleDiscoverDone(msg);     break;
    case 'port_knock':        handlePortKnock(msg);        break;
    case 'ip_blocked':        onIpBlocked(msg.ip);         break;
    case 'ip_unblocked':      onIpUnblocked(msg.ip);       break;
  }
}

// ── Honeypot hit ──────────────────────────────────────────────────────────────
function handleHoneypotHit(msg) {
  // Track country counts for heatmap
  if (msg.country) {
    countryCounts[msg.country] = (countryCounts[msg.country] || 0) + 1;
  }

  // Map marker
  if (msg.lat != null && msg.lng != null && !heatmapActive) {
    const color = riskColor(msg.abuse_score);
    const marker = L.circleMarker([msg.lat, msg.lng], {
      radius: blockedIPs.has(msg.ip) ? 3 : 5,
      fillColor: blockedIPs.has(msg.ip) ? '#333' : color,
      color:     blockedIPs.has(msg.ip) ? '#333' : color,
      weight: 1.5, opacity: 1, fillOpacity: 0.7,
    }).addTo(map);
    marker.bindPopup(
      `<b style="color:${color}">${esc(msg.ip)}</b><br>` +
      `Port ${msg.port} · ${esc(msg.country || '—')}<br>` +
      `${esc(msg.isp || '—')}<br>` +
      (msg.rdns ? `${esc(msg.rdns)}<br>` : '') +
      `Risk: ${msg.abuse_score ?? 'unknown'}<br>` +
      `<small style="color:var(--blue);cursor:pointer" onclick="showProfile('${esc(msg.ip)}')">View profile</small>`
    );
  }

  // Table row
  const tbody = document.getElementById('honey-tbody');
  const tr = document.createElement('tr');
  tr.className = 'row-new';
  tr.dataset.ip = msg.ip;
  if (blockedIPs.has(msg.ip)) tr.classList.add('row-blocked');
  tr.innerHTML = `
    <td>${fmtTs(msg.ts)}</td>
    <td><span style="cursor:pointer;color:var(--blue)" onclick="showProfile('${esc(msg.ip)}')">${esc(msg.ip)}</span>${msg.hit_count > 1 ? ` <span style="color:var(--amber);font-size:0.65rem">×${msg.hit_count}</span>` : ''}</td>
    <td>${msg.port}</td>
    <td class="text">${esc(msg.country || '—')}</td>
    <td class="trunc text">${esc(msg.isp || '—')}</td>
    <td class="trunc">${esc(msg.rdns || '—')}</td>
    <td class="trunc" style="color:var(--text-mid)">${msg.banner ? esc(msg.banner) : '<span style="color:var(--text-dim)">—</span>'}</td>
    <td class="${abuseClass(msg.abuse_score)}">${msg.abuse_score ?? '—'}</td>
    <td><button class="btn-danger" onclick="toggleBlock('${esc(msg.ip)}', this)">${blockedIPs.has(msg.ip) ? 'Unblock' : 'Block'}</button></td>
  `;
  tbody.insertBefore(tr, tbody.firstChild);
  ipRowMap[msg.ip] = tr;
  while (tbody.rows.length > MAX_ROWS) tbody.deleteRow(tbody.rows.length - 1);

  honeyCount++;
  document.getElementById('honey-count-text').textContent = `${honeyCount} hit${honeyCount !== 1 ? 's' : ''} captured`;
}

// ── Block / unblock ───────────────────────────────────────────────────────────
async function toggleBlock(ip, btn) {
  const blocking = !blockedIPs.has(ip);
  try {
    const res = await fetch(`${API_BASE}/${blocking ? 'block' : 'unblock'}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ip }),
    });
    if (!res.ok) throw new Error();
    // WS event will call onIpBlocked/onIpUnblocked
  } catch(_) {}
}

function onIpBlocked(ip) {
  blockedIPs.add(ip);
  markRowBlocked(ip, true);
  updateBlockedCount();
}

function onIpUnblocked(ip) {
  blockedIPs.delete(ip);
  markRowBlocked(ip, false);
  updateBlockedCount();
}

function markRowBlocked(ip, blocked = true) {
  const tr = ipRowMap[ip];
  if (!tr) return;
  if (blocked) {
    tr.classList.add('row-blocked');
    const btn = tr.querySelector('.btn-danger');
    if (btn) btn.textContent = 'Unblock';
  } else {
    tr.classList.remove('row-blocked');
    const btn = tr.querySelector('.btn-danger');
    if (btn) btn.textContent = 'Block';
  }
}

function updateBlockedCount() {
  const el = document.getElementById('blocked-count-text');
  el.textContent = blockedIPs.size > 0 ? `${blockedIPs.size} blocked` : '';
}

// ── Threat escalation ─────────────────────────────────────────────────────────
function handleThreatEscalation(msg) {
  const existing = ipRowMap[msg.ip];
  if (existing) { existing.classList.remove('threat-flash'); void existing.offsetWidth; existing.classList.add('threat-flash'); }
  const tr = document.createElement('tr');
  tr.className = 'threat-row';
  tr.innerHTML = `<td colspan="9" class="text">Persistent attacker — ${esc(msg.ip)} · ${msg.hit_count} hits</td>`;
  document.getElementById('honey-tbody').insertBefore(tr, document.getElementById('honey-tbody').firstChild);
}

// ── Port knock ────────────────────────────────────────────────────────────────
function handlePortKnock(msg) {
  const tr = document.createElement('tr');
  tr.className = 'knock-row';
  tr.innerHTML = `<td colspan="9" class="text">Port scan detected — ${esc(msg.ip)} probed ports ${msg.ports.join(', ')}</td>`;
  document.getElementById('honey-tbody').insertBefore(tr, document.getElementById('honey-tbody').firstChild);
}

// ── Stats ─────────────────────────────────────────────────────────────────────
function handleStats(msg) {
  document.getElementById('stat-total').textContent   = msg.total_hits     ?? '—';
  document.getElementById('stat-unique').textContent  = msg.unique_ips     ?? '—';
  document.getElementById('stat-port').textContent    = msg.top_port       ?? '—';
  document.getElementById('stat-country').textContent = msg.top_country    ?? '—';
  document.getElementById('stat-hour').textContent    = msg.hits_last_hour ?? '—';
  // Refresh timeline on every stats update
  loadTimeline();
}

// ── Rate graph ────────────────────────────────────────────────────────────────
function renderRateGraph(buckets) {
  const bar = document.getElementById('rate-bar');
  // Remove old cols, keep label
  [...bar.querySelectorAll('.rate-col')].forEach(el => el.remove());
  const max = Math.max(1, ...buckets.map(b => b.count));
  const now = Math.floor(Date.now() / 60000) * 60;
  buckets.forEach(b => {
    const col = document.createElement('div');
    col.className = 'rate-col' + (b.ts === now ? ' active' : '');
    col.style.height = `${Math.max(2, (b.count / max) * 22)}px`;
    col.title = `${b.count} hits at ${new Date(b.ts * 1000).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}`;
    bar.appendChild(col);
  });
}

// ── Heatmap toggle ────────────────────────────────────────────────────────────
async function toggleHeatmap() {
  heatmapActive = !heatmapActive;
  const btn = document.getElementById('heatmap-btn');
  btn.style.color = heatmapActive ? 'var(--amber)' : '';
  btn.style.borderColor = heatmapActive ? 'var(--amber)' : '';

  if (heatmapLayer) { map.removeLayer(heatmapLayer); heatmapLayer = null; }
  if (!heatmapActive) return;

  // Fetch GeoJSON country borders
  try {
    const res = await fetch('https://raw.githubusercontent.com/datasets/geo-countries/master/data/countries.geojson');
    const geo = await res.json();
    const maxCount = Math.max(1, ...Object.values(countryCounts));
    heatmapLayer = L.geoJSON(geo, {
      style: (feature) => {
        const name = feature.properties.ADMIN;
        const count = countryCounts[name] || 0;
        const intensity = count / maxCount;
        return {
          fillColor: count === 0 ? 'transparent' : `rgba(255,59,48,${0.1 + intensity * 0.8})`,
          weight: 0.5,
          color: '#1a2440',
          fillOpacity: 1,
        };
      },
      onEachFeature: (feature, layer) => {
        const name = feature.properties.ADMIN;
        const count = countryCounts[name] || 0;
        if (count > 0) layer.bindPopup(`${name}: ${count} hit${count !== 1 ? 's' : ''}`);
      }
    }).addTo(map);
  } catch(e) {
    console.warn('GeoJSON load failed', e);
    heatmapActive = false;
  }
}

// ── Scan result ───────────────────────────────────────────────────────────────
function handleScanResult(msg) {
  const empty = document.getElementById('scan-empty');
  const table = document.getElementById('scan-table');
  const tbody = document.getElementById('scan-tbody');
  tbody.innerHTML = '';

  if (!msg.ports || msg.ports.length === 0) {
    empty.style.display = 'block';
    empty.textContent = `No open ports on ${msg.host}.`;
    table.style.display = 'none';
    return;
  }

  empty.style.display = 'none';
  table.style.display = 'table';

  for (const p of msg.ports) {
    const allCves = CVE[p.service] || [];
    const cves = allCves.filter(c => cveMatch(c, p.version));
    const cveBadges = cves.map(c =>
      `<span class="cve-badge cve-${c.severity}" title="${esc(c.desc)}">${esc(c.id)}</span>`
    ).join('');
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td class="${portClass(p.port)}">${p.port}</td>
      <td class="text">${esc(p.service || '—')}${cveBadges}</td>
      <td style="color:var(--text-mid)">${esc(p.version || '—')}</td>
      <td>${cves.length > 0 ? `<span style="color:var(--red);font-size:0.7rem">⚠ ${cves.length}</span>` : ''}</td>
    `;
    tbody.appendChild(tr);
  }
  document.getElementById('scan-status').textContent =
    `${msg.ports.length} open port${msg.ports.length !== 1 ? 's' : ''} on ${msg.host}`;
}

// ── Scan form ─────────────────────────────────────────────────────────────────
async function triggerScan(evt) {
  evt.preventDefault();
  const host = document.getElementById('scan-host').value.trim();
  if (!host) return;
  const btn = document.getElementById('scan-btn');
  const status = document.getElementById('scan-status');
  btn.disabled = true;
  status.textContent = `Scanning ${host}…`;
  try {
    const res = await fetch(`${API_BASE}/scan`, {
      method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({host}),
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
  } catch(e) {
    status.textContent = `Scan failed: ${e.message}`;
  } finally {
    btn.disabled = false;
  }
}

// ── Discovery ─────────────────────────────────────────────────────────────────
function handleDiscoverHost(msg) {
  document.getElementById('discover-results').style.display = 'block';
  const tr = document.createElement('tr');
  tr.innerHTML = `<td>${esc(msg.ip)}</td><td><button class="discover-scan-btn" onclick="scanFromDiscover('${esc(msg.ip)}')">scan</button></td>`;
  document.getElementById('discover-tbody').appendChild(tr);
}
function handleDiscoverDone(msg) {
  document.getElementById('discover-status').textContent = `${msg.total} host${msg.total !== 1 ? 's' : ''} found on ${msg.subnet}`;
  document.getElementById('discover-btn').disabled = false;
}
function scanFromDiscover(ip) {
  document.getElementById('scan-host').value = ip;
  document.getElementById('scan-form').dispatchEvent(new Event('submit', {cancelable:true, bubbles:true}));
}
async function triggerDiscover(evt) {
  evt.preventDefault();
  const subnet = document.getElementById('discover-subnet').value.trim();
  if (!subnet) return;
  const btn = document.getElementById('discover-btn');
  const status = document.getElementById('discover-status');
  btn.disabled = true;
  document.getElementById('discover-tbody').innerHTML = '';
  document.getElementById('discover-results').style.display = 'none';
  status.textContent = `Sweeping ${subnet}…`;
  try {
    const res = await fetch(`${API_BASE}/discover`, {
      method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({subnet}),
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
  } catch(e) {
    status.textContent = `Failed: ${e.message}`;
    btn.disabled = false;
  }
}

// ── IP Profile Modal ──────────────────────────────────────────────────────────
async function showProfile(ip) {
  document.getElementById('modal-title').textContent = ip;
  document.getElementById('modal-body').innerHTML = '<p style="color:var(--text-dim);font-size:0.8rem">Loading…</p>';
  document.getElementById('modal-overlay').classList.add('open');
  try {
    const res = await fetch(`${API_BASE}/ip/${encodeURIComponent(ip)}`);
    const data = await res.json();
    const blocked = blockedIPs.has(ip);
    const latest = data.hits[0] || {};
    document.getElementById('modal-body').innerHTML = `
      <div class="modal-field"><span>Country</span><b>${esc(latest.country || '—')}</b></div>
      <div class="modal-field"><span>ISP</span><b>${esc(latest.isp || '—')}</b></div>
      <div class="modal-field"><span>rDNS</span><b>${esc(latest.rdns || '—')}</b></div>
      <div class="modal-field"><span>Abuse score</span><b class="${abuseClass(latest.abuse_score)}">${latest.abuse_score ?? '—'}</b></div>
      <div class="modal-field"><span>Total hits</span><b>${data.hits.length}</b></div>
      <div class="modal-field"><span>Status</span><b style="color:${blocked ? 'var(--red)' : 'var(--green)'}">${blocked ? 'Blocked' : 'Active'}</b>
        <button class="btn-danger" style="margin-left:10px" onclick="toggleBlock('${esc(ip)}', this);closeModal()">
          ${blocked ? 'Unblock' : 'Block'}
        </button>
      </div>
      <div id="modal-hits-table">
        <table>
          <thead><tr><th>Time</th><th>Port</th><th>Banner</th></tr></thead>
          <tbody>
            ${data.hits.slice(0,20).map(h => `
              <tr>
                <td>${fmtTs(h.ts)}</td>
                <td>${h.port}</td>
                <td class="trunc">${h.banner ? esc(h.banner) : '<span style="color:var(--text-dim)">—</span>'}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
    `;
  } catch(_) {
    document.getElementById('modal-body').innerHTML = '<p style="color:var(--red)">Failed to load.</p>';
  }
}
function closeModal(evt) {
  if (evt && evt.target !== document.getElementById('modal-overlay')) return;
  document.getElementById('modal-overlay').classList.remove('open');
}

// ── CSV export ────────────────────────────────────────────────────────────────
function downloadCSV() {
  window.location.href = `${API_BASE}/export/csv`;
}

// ── Helpers ───────────────────────────────────────────────────────────────────
function portClass(port) {
  if ([21,22,23,445,3389].includes(port)) return 'port-high';
  if ([80,443,8080,8443].includes(port))  return 'port-med';
  return 'port-low';
}
function riskColor(score) {
  if (score == null) return 'var(--amber)';
  if (score >= 70)   return 'var(--red)';
  if (score >= 30)   return 'var(--amber)';
  return 'var(--green)';
}
function abuseClass(score) {
  if (score == null) return 'abuse-none';
  if (score >= 70)   return 'abuse-high';
  if (score >= 30)   return 'abuse-med';
  return 'abuse-low';
}
function fmtTs(ts) {
  return new Date(ts * 1000).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit', second:'2-digit'});
}
function esc(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
